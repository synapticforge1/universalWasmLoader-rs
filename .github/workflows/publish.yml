name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # NOTE: Written to run under an Actions policy that permits only
      # owner-owned actions (the policy in force under the previous `jrmarcum`
      # owner; the `synapticforge1` org's policy is unverified). Third-party actions (actions/checkout, dtolnay/rust-toolchain,
      # actions-rs/*, …) cause a `startup_failure` — the workflow never runs a
      # single step, so NOTHING reaches crates.io even though a local tag/release
      # may still exist (looks published on GitHub, absent on crates.io). Every
      # step here MUST therefore be a plain `run:` step: checkout via `git clone`,
      # toolchain via the rustup curl installer. Do not reintroduce `uses:`.
      - name: Checkout
        run: |
          git clone --depth=1 --branch ${{ github.ref_name }} \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test (gate)
        run: cargo test --locked

      # The compatibility gate, repeated on the tag (workspace letter H6): the Cargo.toml version
      # must be a large enough bump over the latest crates.io release for the API diff.
      - name: Compatibility gate (cargo semver-checks)
        run: |
          cargo install cargo-semver-checks --locked
          cargo semver-checks check-release

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Add it under" \
                 "repo Settings → Secrets and variables → Actions (from a crates.io API token)."
            exit 1
          fi
          cargo publish --locked

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${GITHUB_REF_NAME} \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
