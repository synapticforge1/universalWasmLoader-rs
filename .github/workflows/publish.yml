name: Publish

# 🔒 The owner's order (2026-11-10; workspace letter H33, release-process.md § 5 U5–U8):
# "CI to check first, then push the tag, and then create the release page from the tag, then
# publish the package to the registry". `scripts/release.ts` pushes `main` only — nobody pushes a
# tag. Every push of `main` runs this workflow; it is a RELEASE when Cargo.toml's version has no
# tag yet ("new"), or has one on this very commit ("rerun": finish what a failed run left).
#
#   checks  - contents: read, NO secret, a clone without credentials. The full gate on the pushed
#             commit: build, tests, the release scripts' tests, and for a release the
#             release-mode compatibility gate (scripts/compat.ts: API floor over the previous tag,
#             SPEC check, the previous tag's tests, `cargo package`). All third-party code runs
#             here, and nowhere else.
#   tag     - contents: write, NO checkout. CI's annotated tag vX.Y.Z on this commit (REST API),
#             read back. A GITHUB_TOKEN tag starts no workflow run, so the next jobs run here.
#   release - contents: write, NO checkout. The GitHub Release page FROM that tag (H32's order:
#             the tag peels to this commit / an existing page = done / POST, read back, peel again),
#             with the crates.io link on top — BEFORE the publish, by the owner's order.
#   publish - id-token: write + contents: read, LAST. crates.io trusted publishing (owner's D2: no
#             stored token): skip if crates.io already lists the version; GitHub OIDC -> a
#             short-lived crates.io token; `cargo publish --no-verify` (no build: `checks` built
#             and packaged this commit); revoke the token; read back, FATAL.
#
# Every step is `run:`; there is no `uses:`. Pinned: Rust through the runner's rustup (it verifies
# the signed channel manifest); cargo-semver-checks by version, --locked; Bun by version AND sha256
# (the release's SHASUMS256.txt; move BUN_VERSION and BUN_SHA256 together, Tooling rule 10).
# Every request has a time limit (best-practices 7.21). A failed job is fixed by "Re-run failed
# jobs": each job skips what is done; never a new or moved tag (U12).

on:
  push:
    branches:
      - main

permissions: {}

# One group per commit, never cancelled: a re-run of the same commit waits for the first; two
# commits with the same untagged version cannot both tag (the second finds the tag elsewhere and
# stops).
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.1"
  SEMVER_CHECKS_VERSION: "0.51.0"
  BUN_VERSION: "1.4.4"
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
  CRATE: universal-wasm-loader

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.state.outputs.state }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history and tags: the compatibility gate compares with the previous release's tag.
      - name: Checkout (no credentials)
        run: |
          git clone -q --no-checkout "https://github.com/$GITHUB_REPOSITORY" .
          git checkout -q --detach "$GITHUB_SHA"
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::checked out $head, this run is for $GITHUB_SHA"
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          v=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n 1)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::no X.Y.Z version line in Cargo.toml (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version $v"

      - name: Install Bun (pinned by sha256)
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP" && mkdir -p "$HOME/.bun/bin"
          mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/" && rm -rf "$RUNNER_TEMP/bun.zip" "$RUNNER_TEMP/bun-linux-x64"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      # new = the version's tag is absent (a release); rerun = it peels to THIS commit (finish a
      # failed run); none = it is elsewhere (an ordinary push of a released version).
      - name: Is this a release?
        id: state
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }} # contents: read — only lifts the API rate limit
        run: bun scripts/github-release.ts state

      - name: Install Rust (pinned)
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo --version

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test (gate)
        run: cargo test --locked

      - name: Test the release scripts
        run: bun test scripts/

      - name: Install cargo-semver-checks (pinned)
        if: steps.state.outputs.state != 'none'
        run: cargo install cargo-semver-checks --version "$SEMVER_CHECKS_VERSION" --locked

      # The release-mode gate on the UNTAGGED candidate: API floor over the previous tag, SPEC
      # check, the previous tag's tests against this src/, `cargo package --locked`.
      - name: Compatibility gate (release mode)
        if: steps.state.outputs.state != 'none'
        run: bun scripts/compat.ts --release

  tag:
    needs: checks
    if: needs.checks.outputs.state != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout (workspace C30 / H32): only the release script, at the exact commit checked.
      - name: Fetch the release script at this commit
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 -o github-release.ts \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/github-release.ts"
          head -n 3 github-release.ts

      - name: Install Bun (pinned by sha256)
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP" && mkdir -p "$HOME/.bun/bin"
          mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/" && rm -rf "$RUNNER_TEMP/bun.zip" "$RUNNER_TEMP/bun-linux-x64"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Create the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: bun github-release.ts tag

  release:
    needs: [checks, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the release script at this commit
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 -o github-release.ts \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/github-release.ts"
          head -n 3 github-release.ts

      # GitHub's release-download service answered 504 to 1.0.2's run (42567711837) while serving
      # the same file to other clients: retry transient failures. The sha256 check decides.
      - name: Install Bun (pinned by sha256)
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP" && mkdir -p "$HOME/.bun/bin"
          mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/" && rm -rf "$RUNNER_TEMP/bun.zip" "$RUNNER_TEMP/bun-linux-x64"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Create the GitHub Release page from the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: bun github-release.ts page

  publish:
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing; nothing else
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: The tag still peels to this commit
        run: |
          tag="refs/tags/v$VERSION"
          refs=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "$tag" "$tag^{}")
          at=$(printf '%s\n' "$refs" | awk -v t="$tag" '$2 == t "^{}" { p = $1 } $2 == t { l = $1 } END { print (p != "" ? p : l) }')
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION is '$at', this run is for $GITHUB_SHA; refusing to publish"
            exit 1
          fi

      # `cargo publish --no-verify` packages the source; it builds nothing, so no package code runs
      # beside the id-token.
      - name: Checkout this commit (no credentials, no history)
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust (pinned)
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo --version

      - name: Install Bun (pinned by sha256)
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP" && mkdir -p "$HOME/.bun/bin"
          mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/" && rm -rf "$RUNNER_TEMP/bun.zip" "$RUNNER_TEMP/bun-linux-x64"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Is the version already on crates.io?
        id: has
        run: bun scripts/crates-io.ts has

      - name: Trusted-publishing token (GitHub OIDC -> crates.io)
        if: steps.has.outputs.published != 'true'
        run: bun scripts/crates-io.ts token

      - name: Publish to crates.io
        if: steps.has.outputs.published != 'true'
        run: cargo publish --locked --no-verify

      - name: Revoke the token
        if: always() && env.CARGO_REGISTRY_TOKEN != ''
        run: bun scripts/crates-io.ts revoke

      - name: Read back from crates.io (fatal)
        run: bun scripts/crates-io.ts readback
